# Unified Backend 镜像构建配置

# 镜像名称和标签
BACKEND_IMAGE="knowbase-backend"
BACKEND_TAG="architecture-v2-dev"

# 构建选项
DOCKERFILE="Dockerfile"
BUILD_CONTEXT="."

# 容器运行时选择（docker 或 sudo nerdctl）
CONTAINER_RUNTIME="docker"

# nerdctl 命名空间（仅 CONTAINER_RUNTIME 为 nerdctl 时生效）
NERDCTL_NAMESPACE="k8s.io"

# 镜像仓库配置
BACKEND_IMAGE_REGISTRY="${BACKEND_IMAGE_REGISTRY:-harbor.sunmoonai.com}"
BACKEND_IMAGE_PROJECT="${BACKEND_IMAGE_PROJECT:-app-images}"
REGISTRY="${REGISTRY:-harbor.sunmoonai.com:30443/k8s-images}"   # 传给 Dockerfile --build-arg REGISTRY，用于基础镜像拉取
PYPI_INDEX_URL="${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
DEBIAN_MIRROR="${DEBIAN_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}"
DEBIAN_SECURITY_MIRROR="${DEBIAN_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}"

# 是否在构建后自动推送镜像
PUSH_IMAGES_AFTER_BUILD="${PUSH_IMAGES_AFTER_BUILD:-false}"
